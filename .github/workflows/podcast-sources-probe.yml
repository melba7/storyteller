# LOFI-FORK: checks the podcast chart addresses (Apple and Spotify) from a
# GitHub runner, which has open internet. Prints each answer between
# BEGIN FIXTURE and END FIXTURE lines and a YES or NO summary. Runs only when
# the script or this file changes on a claude/** branch, or by hand. See
# docs/PODCASTS-LISTS-PLAN.md (C0).
name: Podcast sources probe

on:
  push:
    branches: ["claude/**"]
    paths:
      - tools/fork/probe-podcast-sources.mjs
      - .github/workflows/podcast-sources-probe.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 26.12.1

jobs:
  probe:
    name: Probe the chart addresses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Probe Apple and Spotify
        run: node tools/fork/probe-podcast-sources.mjs
